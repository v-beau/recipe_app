/* =========================================================
   Was koche ich mit …?
   ========================================================= */
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const ADJ = /^(rote?n?|grune?n?|gelbe?n?|weisse?n?|schwarze?n?|frische?n?|gehackte?n?|getrocknete?n?|grosse?n?|kleine?n?|mittelgrosse?n?|weiche?n?|kalte?n?|warme?n?|geriebene?n?|reife?n?|mehlige?n?|festkochende?n?|tiefgekuhlte?n?|junge?n?|feine?n?|grobe?n?|ganze?n?|halbe?n?|bio|evtl\.?|etwas|ca\.?)$/;
function coreName(line) {
  const p = parseIngredient(line);
  const base = (p.name || p.raw).replace(/\(.*?\)/g, ' ').split(/,| oder | und | zum | für | aus der | nach /i)[0].trim();
  const words = base.split(/\s+/);
  while (words.length > 1 && ADJ.test(norm(words[0]))) words.shift();
  return words.join(' ').replace(/^[a-zäöü]/, c => c.toUpperCase());
}
const haveStem = t => { t = norm(t).trim(); return t.length > 4 ? t.replace(/(en|n|e|s)$/, '') : t; };
function lineHas(line, stems) {
  const l = norm(line);
  return stems.some(t => t.length < 4 ? new RegExp('(^|[^a-z])' + escRe(t) + '([^a-z]|$)').test(l) : l.includes(t));
}
function cookMatches(have, usePantry) {
  const stems = have.map(haveStem).filter(Boolean);
  if (!stems.length) return [];
  return state.recipes.map(r => {
    const lines = r.ingredients.filter(l => !isSubHeading(l));
    const matched = lines.filter(l => lineHas(l, stems));
    const missing = lines.filter(l => !matched.includes(l) && !(usePantry && isPantryName(parseIngredient(l).name || l)));
    return { r, matched, missing, total: lines.length };
  }).filter(x => x.matched.length)
    .sort((a, b) => a.missing.length - b.missing.length || b.matched.length - a.matched.length || a.r.title.localeCompare(b.r.title, 'de'));
}

function renderCook(app) {
  $('#pageTitle').textContent = 'Was koche ich mit …?';
  const have = state.have;
  const freq = {};
  state.recipes.forEach(r => r.ingredients.forEach(l => {
    if (isSubHeading(l)) return;
    const n = coreName(l);
    if (n && n.length > 2 && !isPantryName(n)) freq[n] = (freq[n] || 0) + 1;
  }));
  const sugg = Object.keys(freq).sort((a, b) => freq[b] - freq[a] || a.localeCompare(b, 'de'))
    .filter(n => !have.some(h => norm(h) === norm(n))).slice(0, 18);
  app.innerHTML = `
    <a class="back-link" href="#/">‹ Alle Rezepte</a>
    <p class="hint" style="margin-top:0">Gib ein, was du im Kühlschrank oder Vorrat hast. Die App zeigt dir passende Rezepte – zuerst die, bei denen am wenigsten fehlt.</p>
    <form class="shop-add" id="haveForm">
      <label class="sr-only" for="haveIn">Zutat</label>
      <input type="text" id="haveIn" placeholder="z. B. Zucchini, Feta, Reis" autocomplete="off">
      <button class="btn primary" type="submit" aria-label="Hinzufügen">+</button>
    </form>
    ${have.length ? `<div class="chips-wrap">${have.map((h, i) => `<button class="chip on chip-x" data-hrem="${i}">${esc(h)} ✕</button>`).join('')}
      <button class="chip" data-hclear>Alle entfernen</button></div>` : ''}
    ${sugg.length ? `<p class="hint" style="margin-bottom:0">Schnell antippen:</p><div class="chips-wrap">${sugg.map(n => `<button class="chip" data-hadd="${esc(n)}">＋ ${esc(n)}</button>`).join('')}</div>` : ''}
    <label class="pick" style="border:0"><input type="checkbox" id="usePantry" ${state.haveUsePantry ? 'checked' : ''}>
      <span>Vorratsschrank (${esc(pantryList().slice(0, 4).join(', '))}${pantryList().length > 4 ? ' …' : ''}) zählt als vorhanden</span></label>
    <div id="cookResults"></div>`;
  drawCookResults();

  $('#haveForm').onsubmit = async e => {
    e.preventDefault();
    const v = $('#haveIn').value.split(',').map(x => x.trim()).filter(Boolean);
    if (!v.length) return;
    v.forEach(x => { if (!state.have.some(h => norm(h) === norm(x))) state.have.push(x); });
    await Store.set('have', state.have); renderCook(app); $('#haveIn').focus();
  };
  $('#usePantry').onchange = async e => { state.haveUsePantry = e.target.checked; await Store.set('haveUsePantry', state.haveUsePantry); drawCookResults(); };
  app.onclick = async e => {
    if (location.hash !== '#/cook') return;
    const t = e.target;
    const add = t.closest('[data-hadd]');
    if (add) { state.have.push(add.dataset.hadd); await Store.set('have', state.have); renderCook(app); return; }
    const rem = t.closest('[data-hrem]');
    if (rem) { state.have.splice(+rem.dataset.hrem, 1); await Store.set('have', state.have); renderCook(app); return; }
    if (t.closest('[data-hclear]')) { state.have = []; await Store.set('have', state.have); renderCook(app); return; }
    const miss = t.closest('[data-miss]');
    if (miss) {
      const m = cookMatches(state.have, state.haveUsePantry).find(x => x.r.id === miss.dataset.miss);
      if (!m || !m.missing.length) return;
      const L = await chooseList('Fehlendes auf welche Liste?'); if (!L) return;
      addToShop(L, m.r, m.r.servings, m.missing); state.activeList = L.id; await saveShop();
      toast(`${m.missing.length} fehlende Zutaten auf „${L.name}“ 🛒`);
    }
  };
}

function drawCookResults() {
  const box = $('#cookResults'); if (!box) return;
  if (!state.have.length) { box.innerHTML = `<div class="empty"><div class="big">🥕</div><p>Füge oben eine oder mehrere Zutaten hinzu.</p></div>`; return; }
  const res = cookMatches(state.have, state.haveUsePantry);
  if (!res.length) { box.innerHTML = `<div class="empty"><div class="big">🤔</div><p>Kein Rezept enthält diese Zutaten. Versuch es mit einer anderen Schreibweise oder weniger Zutaten.</p></div>`; return; }
  box.innerHTML = `<h3 class="cat-h" style="position:static">${res.length} passende ${res.length === 1 ? 'Rezept' : 'Rezepte'}</h3>` + res.map(({ r, matched, missing }) => `
    <div class="cook-card">
      <a class="entry-main" href="#/r/${encodeURIComponent(r.id)}" style="text-decoration:none;color:inherit">
        <span class="pthumb">${imageHtml(r)}</span>
        <span class="pinfo"><b>${esc(r.title)}</b>
          <span class="hint">✓ ${matched.map(coreName).map(esc).join(', ')}</span>
          ${missing.length ? `<span class="miss">Fehlt (${missing.length}): ${missing.map(coreName).map(esc).join(', ')}</span>` : '<span class="ok">🎉 Alles da!</span>'}
        </span></a>
      ${missing.length ? `<button class="btn small" data-miss="${esc(r.id)}">🛒 Fehlendes einkaufen</button>` : ''}
    </div>`).join('');
}

/* =========================================================
   Wochenplan
   ========================================================= */
const WD = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
const pad2 = n => String(n).padStart(2, '0');
const dISO = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const dParse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const planCfg = () => ({
  household: state.settings.household || 2,
  days: state.settings.planDays || 7,
  perDay: state.settings.perDay || 1,
  start: state.settings.planStart ?? 1
});
function periodDays(offset = state.planOffset) {
  const c = planCfg();
  const t = new Date(); t.setHours(12, 0, 0, 0);
  // Bei festem Starttag und bis zu 7 Tagen wird wochenweise geblättert (z. B. immer Mo–Fr)
  const step = c.start !== 'today' && c.days <= 7 ? 7 : c.days;
  let start = c.start === 'today' ? t : addDays(t, -((t.getDay() - c.start + 7) % 7));
  if (addDays(start, c.days - 1) < t) start = addDays(start, step); // aktueller Zeitraum schon vorbei → nächsten zeigen
  start = addDays(start, offset * step);
  return Array.from({ length: c.days }, (_, i) => dISO(addDays(start, i)));
}
function isoWeek(d) {
  const x = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = x.getUTCDay() || 7; x.setUTCDate(x.getUTCDate() + 4 - day);
  return Math.ceil(((x - new Date(Date.UTC(x.getUTCFullYear(), 0, 1))) / 864e5 + 1) / 7);
}
function periodTitle(days) {
  const a = dParse(days[0]), b = dParse(days[days.length - 1]);
  if (days.length === 1) return a.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });
  if (a.getMonth() === b.getMonth()) return `${a.getDate()}.–${b.getDate()}. ${b.toLocaleDateString('de-DE', { month: 'long' })}`;
  const s = d => d.toLocaleDateString('de-DE', { day: 'numeric', month: 'short' });
  return `${s(a)} – ${s(b)}`;
}
const dayLabel = iso => { const d = dParse(iso); return { wd: WD[d.getDay()], date: `${d.getDate()}.${d.getMonth() + 1}.` }; };
const shortDay = iso => { const d = dParse(iso); return WD[d.getDay()].slice(0, 2) + ' ' + d.getDate() + '.' + (d.getMonth() + 1) + '.'; };
const dayEntries = iso => state.plan[iso] || (state.plan[iso] = []);
async function savePlan() {
  for (const k of Object.keys(state.plan)) if (!state.plan[k].length) delete state.plan[k];
  await Store.set('plan', state.plan);
}
function plannedDatesFor(rid) {
  const today = dISO(new Date());
  return Object.keys(state.plan).filter(k => k >= today && state.plan[k].some(e => e.recipeId === rid)).sort();
}

/* Rezept-Auswahl für den Plan */
function pickForPlan(title, servings) {
  return new Promise(res => {
    const d = $('#planDlg');
    let sv = servings;
    const inPeriod = new Set(periodDays().flatMap(k => (state.plan[k] || []).map(e => e.recipeId)));
    $('#planDlgTitle').textContent = title; $('#planSv').textContent = sv; $('#planQ').value = '';
    const draw = () => {
      const q = norm($('#planQ').value).split(/\s+/).filter(Boolean), s = $('#planSort').value;
      const list = state.recipes.filter(r => { const hay = norm(r.title + ' ' + r.tags.join(' ') + ' ' + r.ingredients.join(' ')); return q.every(t => hay.includes(t)); });
      list.sort((a, b) => s === 'az' ? a.title.localeCompare(b.title, 'de')
        : s === 'rating' ? (b.rating - a.rating) || a.title.localeCompare(b.title, 'de')
        : s === 'fast' ? (totalTime(a) || 1e9) - (totalTime(b) || 1e9)
        : (a.last_cooked || '').localeCompare(b.last_cooked || '') || a.title.localeCompare(b.title, 'de'));
      $('#planList').innerHTML = list.length ? list.map(r => `<button class="prow" data-rid="${esc(r.id)}">
          <span class="pthumb">${imageHtml(r)}</span>
          <span class="pinfo"><b>${esc(r.title)}</b>
            <span class="hint">${[totalTime(r) ? '⏱ ' + fmtMin(totalTime(r)) : '', r.rating ? starsText(r.rating) : '', r.last_cooked ? 'zuletzt ' + fmtDate(r.last_cooked) : 'noch nie gekocht'].filter(Boolean).join(' · ')}</span>
            ${inPeriod.has(r.id) ? '<span><span class="local-badge">schon eingeplant</span></span>' : ''}</span></button>`).join('')
        : '<p class="muted">Keine passenden Rezepte.</p>';
    };
    let done = false;
    const finish = v => { if (done) return; done = true; d.onclick = null; d.onclose = null; if (d.open) d.close(); res(v); };
    $('#planQ').oninput = draw; $('#planSort').onchange = draw;
    d.onclick = e => {
      const sb = e.target.closest('[data-sv]');
      if (sb) { sv = Math.max(1, Math.min(99, sv + +sb.dataset.sv)); $('#planSv').textContent = sv; return; }
      const row = e.target.closest('[data-rid]');
      if (row) { finish({ recipeId: row.dataset.rid, servings: sv }); return; }
      if (e.target.closest('[data-note]')) {
        const t = prompt('Notiz für diesen Tag (z. B. Resten, Auswärts essen, Pizza bestellen):', '');
        if (t && t.trim()) finish({ note: t.trim() });
        return;
      }
      if (e.target.closest('[data-close]') || e.target === d) finish(null);
    };
    d.onclose = () => { if (!d.open) finish(null); }; // verspätete close-Ereignisse eines vorherigen Dialogs ignorieren
    draw(); d.showModal();
  });
}

function entryHtml(iso, e) {
  const menu = `<button class="icon-btn" data-emenu="${iso}|${e.id}" aria-label="Optionen">⋯</button>`;
  if (e.note) return `<div class="entry"><span class="pthumb noteic">📝</span><span class="pinfo"><b>${esc(e.note)}</b></span>${menu}</div>`;
  const r = byId(e.recipeId);
  if (!r) return `<div class="entry"><span class="pinfo"><b class="muted">Rezept nicht mehr vorhanden</b></span>${menu}</div>`;
  return `<div class="entry ${e.cooked ? 'cooked' : ''}">
    <button class="entry-main" data-open="${iso}|${e.id}"><span class="pthumb">${imageHtml(r)}</span>
      <span class="pinfo"><b>${esc(r.title)}</b><span class="hint">${e.servings} ${e.servings === 1 ? 'Portion' : 'Portionen'}${totalTime(r) ? ' · ⏱ ' + fmtMin(totalTime(r)) : ''}${e.cooked ? ' · ✅ gekocht' : ''}</span></span></button>${menu}</div>`;
}
function dayHtml(iso, today) {
  const { wd, date } = dayLabel(iso), es = state.plan[iso] || [];
  let kcal = 0, prot = 0, has = false;
  es.forEach(e => { const r = e.recipeId && byId(e.recipeId); if (r && r.nutrition.calories) { kcal += r.nutrition.calories; prot += r.nutrition.protein || 0; has = true; } });
  return `<section class="day ${iso === today ? 'today' : ''} ${iso < today ? 'past' : ''}">
    <div class="day-h"><b>${wd}</b><span>${date}</span>${iso === today ? '<span class="local-badge">heute</span>' : ''}
      ${has ? `<span class="day-kcal">≈ ${Math.round(kcal)} kcal · ${Math.round(prot)} g Eiweiß pro Person</span>` : ''}</div>
    ${es.map(e => entryHtml(iso, e)).join('')}
    <button class="add-entry" data-add="${iso}">＋ Rezept oder Notiz</button>
  </section>`;
}

function renderPlan(app) {
  $('#pageTitle').textContent = 'Wochenplan';
  const days = periodDays(), today = dISO(new Date()), c = planCfg();
  const count = days.reduce((s, d) => s + (state.plan[d] || []).filter(e => e.recipeId).length, 0);
  app.innerHTML = `
    <div class="plan-nav">
      <button class="icon-btn" data-navp="-1" aria-label="Zurück">‹</button>
      <div class="plan-title"><b>${periodTitle(days)}</b>
        <span class="hint">${c.days === 7 ? 'KW ' + isoWeek(dParse(days[0])) + ' · ' : ''}${c.household} ${c.household === 1 ? 'Person' : 'Personen'} · ${count} ${count === 1 ? 'Rezept' : 'Rezepte'}</span></div>
      <button class="icon-btn" data-navp="1" aria-label="Weiter">›</button>
    </div>
    <div class="btn-row" style="margin:10px 0 0">
      ${state.planOffset ? '<button class="btn small" data-today>📍 Heute</button>' : ''}
      <button class="btn small" data-plancfg>⚙️ Einstellungen</button>
    </div>
    ${days.map(iso => dayHtml(iso, today)).join('')}
    <div class="btn-row"><button class="btn primary block" data-planshop>🛒 Zutaten einkaufen</button></div>
    <div class="btn-row">
      <button class="btn" data-fill>🎲 Leere Tage füllen</button>
      <button class="btn" data-copyprev>📋 Vorherige übernehmen</button>
    </div>
    <div class="btn-row">
      <button class="btn" data-planshare>📤 Plan teilen</button>
      <button class="btn danger" data-planclear>🧹 Plan leeren</button>
    </div>`;

  app.onclick = async e => {
    if (location.hash !== '#/plan') return;
    const t = e.target;
    const nv = t.closest('[data-navp]');
    if (nv) { state.planOffset += +nv.dataset.navp; renderPlan(app); return; }
    if (t.closest('[data-today]')) { state.planOffset = 0; renderPlan(app); return; }
    if (t.closest('[data-plancfg]')) { openPlanSettings(); return; }
    const add = t.closest('[data-add]');
    if (add) {
      const iso = add.dataset.add, l = dayLabel(iso);
      const v = await pickForPlan(`${l.wd}, ${l.date}`, planCfg().household);
      if (!v) return;
      dayEntries(iso).push({ id: uid(), ...v, cooked: false });
      await savePlan(); renderPlan(app); return;
    }
    const op = t.closest('[data-open]');
    if (op) {
      const [iso, id] = op.dataset.open.split('|');
      const en = (state.plan[iso] || []).find(x => x.id === id);
      if (en) { state.servings[en.recipeId] = en.servings; location.hash = '#/r/' + encodeURIComponent(en.recipeId); }
      return;
    }
    const m = t.closest('[data-emenu]');
    if (m) { const [iso, id] = m.dataset.emenu.split('|'); await entryMenu(iso, id); if (location.hash === '#/plan') renderPlan(app); return; }
    if (t.closest('[data-planshop]')) { planToShop(); return; }
    if (t.closest('[data-fill]')) { await fillPlan(); renderPlan(app); return; }
    if (t.closest('[data-copyprev]')) { await copyPrevious(); renderPlan(app); return; }
    if (t.closest('[data-planshare]')) { sharePlan(); return; }
    if (t.closest('[data-planclear]')) {
      if (!confirm('Alle Einträge in diesem Zeitraum löschen?')) return;
      days.forEach(d => delete state.plan[d]); await savePlan(); renderPlan(app); toast('Plan geleert');
    }
  };
}

async function entryMenu(iso, id) {
  const es = state.plan[iso] || [], en = es.find(x => x.id === id);
  if (!en) return;
  const r = en.recipeId && byId(en.recipeId);
  const opts = [];
  if (r) opts.push({ label: '📖 Rezept öffnen', value: 'open' }, { label: `👥 Portionen ändern (${en.servings})`, value: 'serv' },
    { label: en.cooked ? '↩️ Doch nicht gekocht' : '✅ Als gekocht markieren', value: 'cooked' });
  if (en.note) opts.push({ label: '✏️ Notiz bearbeiten', value: 'edit' });
  opts.push({ label: '🔄 Durch anderes Rezept ersetzen', value: 'replace' }, { label: '📅 Auf anderen Tag verschieben', value: 'move' },
    { label: '🗑 Entfernen', value: 'del', danger: true });
  const v = await choose(r ? r.title : en.note || 'Eintrag', opts);
  if (!v) return;
  if (v === 'open') { state.servings[r.id] = en.servings; location.hash = '#/r/' + encodeURIComponent(r.id); return; }
  if (v === 'serv') { const n = parseInt(prompt('Wie viele Portionen?', en.servings), 10); if (n > 0 && n < 100) en.servings = n; }
  if (v === 'cooked') {
    en.cooked = !en.cooked;
    if (en.cooked && (!r.last_cooked || r.last_cooked < iso)) { r.last_cooked = iso; await saveRecipe(r); }
    if (en.cooked) toast('Als gekocht gespeichert 👩‍🍳');
  }
  if (v === 'edit') { const t = prompt('Notiz:', en.note); if (t && t.trim()) en.note = t.trim(); }
  if (v === 'replace') {
    const p = await pickForPlan('Ersetzen durch …', en.servings || planCfg().household);
    if (p) { delete en.note; delete en.recipeId; delete en.servings; Object.assign(en, p, { cooked: false }); }
  }
  if (v === 'move') {
    const targets = [...periodDays(), ...periodDays(state.planOffset + 1)].filter(d => d !== iso);
    const tgt = await choose('Verschieben auf …', targets.map(d => ({ label: `${dayLabel(d).wd}, ${dayLabel(d).date}`, value: d })));
    if (tgt) { state.plan[iso] = es.filter(x => x !== en); dayEntries(tgt).push(en); toast(`Verschoben auf ${dayLabel(tgt).wd}`); }
  }
  if (v === 'del') state.plan[iso] = es.filter(x => x !== en);
  await savePlan();
}

async function fillPlan() {
  if (!state.recipes.length) { toast('Noch keine Rezepte vorhanden.'); return; }
  const c = planCfg(), today = dISO(new Date()), now = new Date();
  const days = periodDays().filter(d => d >= today);
  const planned = new Set(periodDays().flatMap(d => (state.plan[d] || []).map(e => e.recipeId).filter(Boolean)));
  let added = 0, prevTags = [];
  for (const d of days) {
    const need = c.perDay - (state.plan[d] || []).length;
    for (let k = 0; k < need; k++) {
      let pool = state.recipes.filter(r => !planned.has(r.id));
      if (!pool.length) pool = [...state.recipes];
      const scored = pool.map(r => {
        const since = r.last_cooked ? (now - dParse(r.last_cooked)) / 864e5 : 45;
        return [r, Math.min(since, 60) + r.rating * 4 + Math.random() * 30 - (r.tags.some(t => prevTags.includes(t)) ? 15 : 0)];
      }).sort((a, b) => b[1] - a[1]);
      const r = scored[0][0];
      dayEntries(d).push({ id: uid(), recipeId: r.id, servings: c.household, cooked: false });
      planned.add(r.id); prevTags = r.tags; added++;
    }
  }
  await savePlan();
  toast(added ? `${added} ${added === 1 ? 'Rezept' : 'Rezepte'} vorgeschlagen – über ⋯ kannst du einzelne ersetzen` : 'Alle Tage sind schon geplant.', 4000);
}

async function copyPrevious() {
  const days = periodDays(), prev = periodDays(state.planOffset - 1);
  let n = 0;
  days.forEach((d, i) => {
    const src = state.plan[prev[i]] || [];
    if (!src.length || (state.plan[d] || []).length) return;
    state.plan[d] = src.map(e => ({ ...e, id: uid(), cooked: false })); n++;
  });
  await savePlan();
  toast(n ? `${n} ${n === 1 ? 'Tag' : 'Tage'} übernommen` : 'Nichts übernommen – die Tage sind schon belegt oder der vorherige Zeitraum ist leer.', 4000);
}

async function sharePlan() {
  const days = periodDays();
  const lines = days.map(d => {
    const es = (state.plan[d] || []).map(e => e.note ? e.note : (byId(e.recipeId)?.title || '?') + ` (${e.servings} P.)`);
    return `${shortDay(d)}: ${es.length ? es.join(', ') : '–'}`;
  });
  const text = `📅 Wochenplan ${periodTitle(days)}\n\n` + lines.join('\n');
  try { if (navigator.share) { await navigator.share({ title: 'Wochenplan', text }); return; } } catch (e) { if (e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text); toast('Plan kopiert 📋'); } catch (e) { prompt('Plan zum Kopieren:', text); }
}

function chooseDays(days) {
  return new Promise(res => {
    const d = $('#genDlg');
    $('#genTitle').textContent = 'Für welche Tage einkaufen?';
    $('#genBody').innerHTML = days.map(iso => `<label class="pick"><input type="checkbox" value="${iso}" checked>
      <span><b>${dayLabel(iso).wd}, ${dayLabel(iso).date}</b><br><span class="hint">${state.plan[iso].filter(e => e.recipeId && byId(e.recipeId)).map(e => esc(byId(e.recipeId).title)).join(', ')}</span></span></label>`).join('');
    $('#genFoot').hidden = false;
    $('#genFoot').innerHTML = '<button class="btn" data-close>Abbrechen</button><button class="btn primary" data-ok>Weiter</button>';
    let done = false;
    const finish = v => { if (done) return; done = true; d.onclick = null; d.onclose = null; if (d.open) d.close(); res(v); };
    d.onclick = e => {
      if (e.target.closest('[data-ok]')) finish($$('#genBody input:checked').map(i => i.value));
      else if (e.target.closest('[data-close]') || e.target === d) finish(null);
    };
    d.onclose = () => { if (!d.open) finish(null); }; // verspätete close-Ereignisse eines vorherigen Dialogs ignorieren
    d.showModal();
  });
}

async function planToShop() {
  const days = periodDays().filter(d => (state.plan[d] || []).some(e => e.recipeId && byId(e.recipeId)));
  if (!days.length) { toast('In diesem Zeitraum sind noch keine Rezepte geplant.'); return; }
  const sel = await chooseDays(days);
  if (!sel || !sel.length) return;
  const def = 'Wochenplan ' + periodTitle(periodDays());
  const v = await choose('Auf welche Einkaufsliste?', [
    { label: `＋ Neue Liste „${def}“`, value: '__new' },
    ...state.lists.map(l => ({ label: l.name, value: l.id }))
  ]);
  if (!v) return;
  const L = v === '__new' ? createList(def) : state.lists.find(l => l.id === v);
  let n = 0;
  sel.forEach(d => state.plan[d].forEach(e => { const r = e.recipeId && byId(e.recipeId); if (r) { addToShop(L, r, e.servings); n++; } }));
  state.activeList = L.id; await saveShop();
  toast(`Zutaten aus ${n} ${n === 1 ? 'Rezept' : 'Rezepten'} auf „${L.name}“ 🛒`, 3500);
  location.hash = '#/shop';
}

function openPlanSettings() {
  const d = $('#genDlg'), c = planCfg();
  const v = { household: c.household, days: c.days, perDay: c.perDay };
  const row = (k, title, hint) => `<div class="set-row"><span><b>${title}</b><br><span class="hint">${hint}</span></span>
    <span class="stepper"><button class="icon-btn" data-st="${k}|-1" aria-label="Weniger">−</button><b id="st-${k}">${v[k]}</b><button class="icon-btn" data-st="${k}|1" aria-label="Mehr">+</button></span></div>`;
  $('#genTitle').textContent = 'Wochenplan-Einstellungen';
  $('#genBody').innerHTML = `
    ${row('household', 'Haushaltsgrösse', 'Standard-Portionen für jedes geplante Rezept')}
    ${row('days', 'Anzahl Tage', 'So viele Tage umfasst ein Plan (1–14)')}
    ${row('perDay', 'Rezepte pro Tag', 'So viele schlägt „🎲 Leere Tage füllen“ pro Tag vor. Von Hand kannst du beliebig viele eintragen.')}
    <label class="field"><span>Plan beginnt am</span><select id="st-start">
      ${[1, 2, 3, 4, 5, 6, 0].map(i => `<option value="${i}" ${c.start === i ? 'selected' : ''}>${WD[i]}</option>`).join('')}
      <option value="today" ${c.start === 'today' ? 'selected' : ''}>Heute (immer ab dem aktuellen Tag)</option></select></label>`;
  $('#genFoot').hidden = false;
  $('#genFoot').innerHTML = '<button class="btn" data-close>Abbrechen</button><button class="btn primary" data-ok>Speichern</button>';
  const max = { household: 20, days: 14, perDay: 5 };
  const close = () => { d.onclick = null; d.onclose = null; if (d.open) d.close(); };
  d.onclose = null;
  d.onclick = async e => {
    const st = e.target.closest('[data-st]');
    if (st) { const [k, dl] = st.dataset.st.split('|'); v[k] = Math.max(1, Math.min(max[k], v[k] + +dl)); $('#st-' + k).textContent = v[k]; return; }
    if (e.target.closest('[data-ok]')) {
      const s = $('#st-start').value;
      Object.assign(state.settings, { household: v.household, planDays: v.days, perDay: v.perDay, planStart: s === 'today' ? 'today' : +s });
      await Store.set('settings', state.settings); close(); state.planOffset = 0; toast('Einstellungen gespeichert');
      if (location.hash === '#/plan') renderPlan($('#app'));
      if (location.hash === '#/more') renderMore($('#app'));
      return;
    }
    if (e.target.closest('[data-close]') || e.target === d) close();
  };
  d.showModal();
}

/* =========================================================
   Formular: Neu / Bearbeiten
   ========================================================= */
function parseRecipeText(text) {
  const out = { ingredients: [], steps: [], notes: [] };
  const url = text.match(/https?:\/\/[^\s<>"')]+/);
  if (url) out.source_url = url[0];
  const toMin = (n, u) => Math.round(parseFloat(String(n).replace(',', '.')) * (/^(std|stunde|h)/i.test(u) ? 60 : 1));
  const TIME = String.raw`\s*:?\s*(?:ca\.?\s*)?(\d+(?:[.,]\d+)?)\s*(min(?:uten|\.)?|std\.?|stunden?|h)\b`;
  const reServ = /(?:für|portionen|personen|servings|ergibt)\s*:?\s*(\d+)|(\d+)\s*(?:portionen|portion|personen|person|servings)\b/i;
  const rePrep = new RegExp(String.raw`(vorbereitung(?:szeit)?|arbeitszeit|zubereitungszeit|prep(?:aration)?(?:\s*time)?)` + TIME, 'i');
  const reCook = new RegExp(String.raw`(koch(?:zeit)?|back(?:zeit)?|garzeit|cook(?:ing)?(?:\s*time)?)` + TIME, 'i');
  const reTotal = new RegExp(String.raw`(gesamtzeit|gesamt|total(?:\s*time)?)` + TIME, 'i');
  const reKcal = /(\d+(?:[.,]\d+)?)\s*kcal|(?:kalorien|brennwert|calories)\s*:?\s*(\d+(?:[.,]\d+)?)/i;
  const reProt = /(?:eiwei(?:ß|ss)|protein)\s*:?\s*(\d+(?:[.,]\d+)?)/i;
  const reFat = /\b(?:fett|fat)\s*:?\s*(\d+(?:[.,]\d+)?)/i;
  const reCarb = /(?:kohlenhydrate|\bkh\b|carbs|carbohydrates)\s*:?\s*(\d+(?:[.,]\d+)?)/i;
  const reDiff = /schwierigkeit(?:sgrad)?\s*:?\s*(einfach|leicht|simpel|normal|mittel|schwer|anspruchsvoll|pfiffig)/i;
  let m;
  if ((m = text.match(reServ))) out.servings = +(m[1] || m[2]);
  if ((m = text.match(rePrep))) out.prep_time = toMin(m[2], m[3]);
  if ((m = text.match(reCook))) out.cook_time = toMin(m[2], m[3]);
  if (!out.prep_time && !out.cook_time && (m = text.match(reTotal))) out.cook_time = toMin(m[2], m[3]);
  out.nutrition = {};
  if ((m = text.match(reKcal))) out.nutrition.calories = num(m[1] || m[2]);
  if ((m = text.match(reProt))) out.nutrition.protein = num(m[1]);
  if ((m = text.match(reFat))) out.nutrition.fat = num(m[1]);
  if ((m = text.match(reCarb))) out.nutrition.carbs = num(m[1]);
  if ((m = text.match(reDiff))) out.difficulty = /einfach|leicht|simpel/i.test(m[1]) ? 'einfach' : /schwer|anspruchsvoll|pfiffig/i.test(m[1]) ? 'schwer' : 'mittel';

  const H_ING = /^(zutaten|ingredients|einkaufsliste|du brauchst|das brauchst du)\b/i;
  const H_STEP = /^(zubereitung|anleitung|so geht'?s|so wird'?s gemacht|schritte|arbeitsschritte|instructions|directions|method|preparation|steps)\b/i;
  const H_NOTE = /^(notizen?|tipps?|hinweise?|anmerkungen?|notes?|tips?)\b/i;
  const isMeta = l => l.length < 90 && [reServ, rePrep, reCook, reTotal, reKcal, reProt, reFat, reCarb, reDiff].some(re => re.test(l)) && !QTY_RE.test(l.replace(/^[-•*·]\s*/, '')) ;
  let mode = null;
  for (let l of text.split(/\r?\n/)) {
    l = l.trim().replace(/\s+/g, ' ');
    if (!l) continue;
    if (/^https?:\/\/\S+$/.test(l)) continue;
    const plain = l.replace(/^#+\s*/, '').replace(/^\*\*(.*)\*\*$/, '$1');
    if (plain.length < 45 && H_ING.test(plain)) { mode = 'ing'; continue; }
    if (plain.length < 45 && H_STEP.test(plain)) { mode = 'step'; continue; }
    if (plain.length < 45 && H_NOTE.test(plain)) { mode = 'note'; const rest = plain.replace(H_NOTE, '').replace(/^\s*:\s*/, ''); if (rest) out.notes.push(rest); continue; }
    if (/^(nährwert|naehrwert|nutrition|kalorien|brennwert)/i.test(plain)) continue;
    if (!out.title && !isMeta(plain)) { out.title = plain.replace(/\s*[-|–]\s*(rezept|chefkoch).*$/i, ''); continue; }
    if (mode !== 'note' && mode !== 'step' && isMeta(plain)) continue;
    const numbered = /^(\d+[.)]|schritt\s*\d+\s*:?)\s+/i.test(plain);
    const clean = plain.replace(/^([-•*·–▢☐□✓▪︎]|\d+[.)]|schritt\s*\d+\s*:?)\s*/i, '');
    if (!clean) continue;
    if (mode === 'ing') out.ingredients.push(clean);
    else if (mode === 'step') out.steps.push(clean);
    else if (mode === 'note') out.notes.push(plain);
    else if (numbered) out.steps.push(clean);
    else if (QTY_RE.test(clean) && clean.length < 70) out.ingredients.push(clean);
    else if (clean.length >= 40) out.steps.push(clean);
    else out.ingredients.push(clean);
  }
  return out;
}

function resizeImage(file, max = 1000, quality = 0.75) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Bild konnte nicht gelesen werden')); };
    img.src = url;
  });
}

}

function setTheme(t) {
  try { t === 'auto' ? localStorage.removeItem('rz_theme') : localStorage.setItem('rz_theme', t); } catch (e) {}
  if (t === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
  updateThemeColor();
}
function updateThemeColor() {
  const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  $('meta[name="theme-color"]').setAttribute('content', bg || '#faf7f2');
}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', updateThemeColor);

async function exportBackup() {
  const data = [...state.recipes].sort((a, b) => String(a.added_at).localeCompare(String(b.added_at)));
  const json = JSON.stringify(data, null, 2) + '\n';
  const file = new File([json], 'recipes.json', { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] }) && /Android|iPhone|iPad/i.test(navigator.userAgent)) {
      await navigator.share({ files: [file], title: 'recipes.json' }); return;
    }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = 'recipes.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast(`${data.length} Rezepte exportiert`);
}

async function exportSettings() {
  const data = { type: 'rezepte-einstellungen', version: 1, exported_at: new Date().toISOString(), settings: state.settings, lists: state.lists, activeList: state.activeList, plan: state.plan };
  const file = new File([JSON.stringify(data, null, 2)], 'rezepte-einstellungen.json', { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] }) && /Android|iPhone|iPad/i.test(navigator.userAgent)) { await navigator.share({ files: [file], title: file.name }); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('Einstellungen gesichert');
}

async function importBackup(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { toast('⚠️ Die Datei ist keine gültige JSON-Datei.', 4000); return; }
  if (data && data.type === 'rezepte-einstellungen') {
    const s = data.settings || {};
    state.settings = { ...state.settings, ...s, products: { ...(state.settings.products || {}), ...(s.products || {}) } };
    await Store.set('settings', state.settings);
    if (confirm('Einstellungen übernommen ✅\n\nSollen auch die Einkaufslisten und der Wochenplan aus der Datei wiederhergestellt werden? (Die aktuellen werden dabei ersetzt.)')) {
      if (Array.isArray(data.lists) && data.lists.length) { state.lists = data.lists; state.activeList = data.activeList || data.lists[0].id; await saveShop(); }
      if (data.plan && typeof data.plan === 'object') { state.plan = data.plan; await savePlan(); }
    }
    updateShopBadge(); toast('Wiederhergestellt ✅'); renderMore($('#app')); return;
  }
  const list = Array.isArray(data) ? data : Array.isArray(data?.recipes) ? data.recipes : null;
  if (!list) { toast('⚠️ In der Datei wurden keine Rezepte gefunden.', 4000); return; }
  const recs = list.filter(x => x && x.title).map(normalizeRecipe);
  if (!recs.length) { toast('⚠️ In der Datei wurden keine Rezepte gefunden.', 4000); return; }
  const replace = confirm(`${recs.length} Rezepte gefunden.\n\nOK = ALLES ERSETZEN (deine aktuellen Rezepte auf diesem Gerät werden durch die Datei ersetzt)\nAbbrechen = nur ERGÄNZEN (neue Rezepte hinzufügen, gleiche aktualisieren)`);
  if (replace) {
    const ids = new Set(recs.map(r => r.id));
    state.local = { recipes: {}, deleted: state.remote.map(r => r.id).filter(id => !ids.has(id)) };
  }
  for (const r of recs) { state.local.recipes[r.id] = r; state.local.deleted = state.local.deleted.filter(x => x !== r.id); }
  await saveLocal(); rebuild();
  toast(`${recs.length} Rezepte importiert ✅`, 3500);
  renderMore($('#app'));
}

/* =========================================================
   Start
   ========================================================= */
async function init() {
  updateThemeColor();
  const [local, lists, oldShop, settings, plan, have, haveUsePantry] = await Promise.all([Store.get('local'), Store.get('lists'), Store.get('shop'), Store.get('settings'), Store.get('plan'), Store.get('have'), Store.get('haveUsePantry')]);
  if (Array.isArray(have)) state.have = have;
  if (typeof haveUsePantry === 'boolean') state.haveUsePantry = haveUsePantry;
  if (plan && typeof plan === 'object') state.plan = plan;
  if (local && local.recipes) state.local = { recipes: local.recipes, deleted: local.deleted || [] };
  if (settings) state.settings = { ...state.settings, ...settings };
  if (lists && Array.isArray(lists.lists) && lists.lists.length) {
    state.lists = lists.lists; state.activeList = lists.active;
    state.lists.forEach(l => l.items.forEach(i => {
      if (i.dim === undefined) { const d = unitDim(i.unit); i.dim = d ? d[0] : ''; if (d && i.qty != null) i.qty *= d[1]; i.key = itemKey(i.unit, i.name); }
    }));
  }
  else {
    const l = createList('Einkaufsliste');
    if (Array.isArray(oldShop)) l.items = oldShop.map(i => ({ ...i, cat: i.cat || categorize(i.unit, i.name) }));
  }
  try {
    const res = await fetch('recipes.json', { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    state.remote = (Array.isArray(data) ? data : data.recipes || []).filter(x => x && x.title).map(normalizeRecipe);
  } catch (e) { state.remoteOk = false; }
  rebuild();

  // Geteilter Link (Android: "Teilen" → "Rezepte")
  const qp = new URLSearchParams(location.search);
  if (qp.has('url') || qp.has('text') || qp.has('title')) {
    const all = [qp.get('url'), qp.get('text'), qp.get('title')].filter(Boolean).join(' ');
    const m = all.match(/https?:\/\/[^\s]+/);
    history.replaceState(null, '', location.pathname + '#/new');
    if (m) state.prefillUrl = m[0];
  }
  window.addEventListener('hashchange', route);
  route();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
}
init();
</script>
