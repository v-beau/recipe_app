# Importiert automatisch ein Rezept, sobald ein neues Issue angelegt wird.
# Der Rezept-Link muss im Titel des Issues stehen.
name: Rezept importieren

on:
  issues:
    types: [opened]

permissions:
  contents: write   # recipes.json und Bilder speichern
  issues: write     # Issue kommentieren und schließen

# Mehrere Importe nacheinander ausführen, nicht gleichzeitig
concurrency:
  group: rezept-import
  cancel-in-progress: false

jobs:
  import:
    # Sicherheit: Nur der Besitzer und eingeladene Mitarbeiter (Collaborators) dürfen importieren.
    # Issues von allen anderen werden einfach ignoriert.
    if: >-
      github.event.issue.author_association == 'OWNER' ||
      github.event.issue.author_association == 'COLLABORATOR'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      RESULT_FILE: ${{ runner.temp }}/result.md

    steps:
      - name: Repository holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Bibliotheken installieren
        run: pip install -r scripts/requirements.txt

      - name: Rezept importieren
        id: import
        env:
          # Titel und Text werden als Umgebungsvariablen übergeben (sicher gegen Code-Einschleusung)
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/import_recipe.py

      - name: Änderungen speichern
        if: steps.import.outputs.status == 'success'
        env:
          RECIPE_TITLE: ${{ steps.import.outputs.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recipes.json
          if [ -d images ]; then git add images; fi
          git commit -m "Rezept importiert: ${RECIPE_TITLE}"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1

      - name: Issue kommentieren und schließen
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RESULT_FILE"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"

      - name: Bei technischem Fehler Bescheid geben
        if: failure()
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "❌ **Technischer Fehler beim Import.** Details findest du hier: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Tipp: Prüfe unter *Settings → Actions → General → Workflow permissions*, ob **Read and write permissions** ausgewählt ist. Du kannst das Rezept auch in der App über **➕ Neu → 📋 Rezepttext einfügen** eintragen."
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"
